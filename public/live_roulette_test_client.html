
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.app { padding: 1rem 0; display: flex; flex-direction: column; gap: 12px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; }
.card-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: var(--border-radius-md); }
.badge-waiting  { background: var(--color-background-secondary); color: var(--color-text-secondary); }
.badge-betting  { background: var(--color-background-success); color: var(--color-text-success); }
.badge-spinning { background: var(--color-background-warning); color: var(--color-text-warning); }
.badge-results  { background: var(--color-background-info); color: var(--color-text-info); }
.badge-disconnected { background: var(--color-background-danger); color: var(--color-text-danger); }
.badge-connected    { background: var(--color-background-success); color: var(--color-text-success); }
.log { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px; height: 220px; overflow-y: auto; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); display: flex; flex-direction: column; gap: 3px; }
.log-entry { line-height: 1.4; }
.log-in  { color: var(--color-text-success); }
.log-out { color: var(--color-text-info); }
.log-err { color: var(--color-text-danger); }
.log-sys { color: var(--color-text-secondary); }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.field label { font-size: 12px; color: var(--color-text-secondary); }
.field input, .field select { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.number-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.num-btn { font-size: 11px; padding: 4px 2px; border-radius: 4px; cursor: pointer; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); transition: background 0.15s; }
.num-btn:hover { background: var(--color-background-tertiary); }
.num-btn.red { color: #E24B4A; }
.num-btn.green-num { color: #639922; }
.timer-bar { height: 4px; background: var(--color-background-secondary); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.timer-fill { height: 100%; background: #639922; border-radius: 2px; transition: width 1s linear, background 0.3s; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 10px; }
.stat-label { font-size: 11px; color: var(--color-text-secondary); }
.stat-value { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-top: 2px; }
.result-number { font-size: 48px; font-weight: 500; text-align: center; line-height: 1; }
.result-color { font-size: 13px; text-align: center; margin-top: 4px; color: var(--color-text-secondary); }
.winners-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; max-height: 80px; overflow-y: auto; }
.winner-entry { font-size: 12px; display: flex; justify-content: space-between; padding: 4px 8px; background: var(--color-background-success); border-radius: var(--border-radius-md); color: var(--color-text-success); }
</style>

<div class="app">
  <h2 class="sr-only">Live roulette WebSocket test client</h2>

  <div class="row">
    <div class="card">
      <div class="card-title">Connection</div>
      <div class="field">
        <label>Server URL</label>
        <input id="serverUrl" value="http://localhost:2345/live-roulette" />
      </div>
      <div class="btn-row">
        <button id="btnConnect">Connect</button>
        <button id="btnDisconnect">Disconnect</button>
        <span id="connBadge" class="badge badge-disconnected">disconnected</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Room</div>
      <div class="field">
        <label>Room ID</label>
        <input id="roomId" placeholder="clx1abc123" />
      </div>
      <div class="btn-row">
        <button id="btnJoin">Join</button>
        <button id="btnLeave">Leave</button>
        <button id="btnListRooms">List rooms</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <div class="card-title">Game state</div>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <span id="phaseBadge" class="badge badge-waiting">WAITING</span>
        <span id="timeLeftText" style="font-size:13px; color:var(--color-text-secondary);">—</span>
      </div>
      <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:0%"></div></div>
      <div class="stat-grid" style="margin-top:10px;">
        <div class="stat"><div class="stat-label">Players</div><div class="stat-value" id="statPlayers">—</div></div>
        <div class="stat"><div class="stat-label">Round ID</div><div class="stat-value" id="statRound" style="font-size:11px; word-break:break-all;">—</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Last result</div>
      <div class="result-number" id="resultNumber">—</div>
      <div class="result-color" id="resultColor"></div>
      <div class="winners-list" id="winnersList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Place bet</div>
    <div class="row" style="margin-bottom:8px;">
      <div class="field" style="margin:0;">
        <label>Bet type</label>
        <select id="betType">
          <option value="NUMBER">NUMBER</option>
          <option value="COLOR">COLOR</option>
          <option value="ODD_EVEN">ODD_EVEN</option>
          <option value="HIGH_LOW">HIGH_LOW</option>
          <option value="DOZEN">DOZEN</option>
          <option value="COLUMN">COLUMN</option>
        </select>
      </div>
      <div class="field" style="margin:0;">
        <label>Bet value</label>
        <input id="betValue" placeholder="17" />
      </div>
    </div>
    <div class="field">
      <label>Amount</label>
      <input id="betAmount" type="number" value="10" min="0.01" />
    </div>
    <div class="btn-row">
      <button id="btnBet">Place bet</button>
    </div>
    <div style="margin-top:10px;">
      <div style="font-size:11px; color:var(--color-text-secondary); margin-bottom:4px;">Quick number pick</div>
      <div class="number-grid" id="numberGrid"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Event log</div>
    <div class="log" id="log"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button id="btnClearLog">Clear log</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script>
const RED_NUMBERS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

let socket = null;
let currentPhase = 'WAITING';
let phaseDuration = { BETTING: 15, SPINNING: 6, RESULTS: 5, WAITING: 0 };

const $ = id => document.getElementById(id);

function log(msg, type = 'sys') {
  const el = $('log');
  const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.textContent = `[${now}] ${msg}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function setPhase(phase, timeLeft) {
  currentPhase = phase;
  const badge = $('phaseBadge');
  badge.textContent = phase;
  badge.className = 'badge badge-' + phase.toLowerCase();
  $('timeLeftText').textContent = timeLeft != null ? `${timeLeft}s` : '—';
  const total = phaseDuration[phase] || 15;
  const pct = timeLeft != null ? (timeLeft / total) * 100 : 0;
  const fill = $('timerFill');
  fill.style.width = pct + '%';
  fill.style.background = phase === 'BETTING' ? '#639922' : phase === 'SPINNING' ? '#BA7517' : '#185FA5';
}

function buildNumberGrid() {
  const grid = $('numberGrid');
  grid.innerHTML = '';
  for (let i = 0; i <= 36; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn' + (i === 0 ? ' green-num' : RED_NUMBERS.has(i) ? ' red' : '');
    btn.textContent = i;
    btn.onclick = () => {
      $('betType').value = 'NUMBER';
      $('betValue').value = String(i);
    };
    grid.appendChild(btn);
  }
}

function connect() {
  const url = $('serverUrl').value.trim();
  if (socket) socket.disconnect();

  log(`Connecting to ${url}…`);
  socket = io(url, { withCredentials: true, transports: ['websocket'] });

  socket.on('connect', () => {
    $('connBadge').textContent = 'connected';
    $('connBadge').className = 'badge badge-connected';
    log(`Connected — socket id: ${socket.id}`, 'in');
  });

  socket.on('disconnect', reason => {
    $('connBadge').textContent = 'disconnected';
    $('connBadge').className = 'badge badge-disconnected';
    log(`Disconnected: ${reason}`, 'err');
    setPhase('WAITING', null);
  });

  socket.on('live_roulette:state', state => {
    log(`← state: phase=${state.phase} timeLeft=${state.timeLeft} players=${state.playerCount}`, 'in');
    setPhase(state.phase, state.timeLeft);
    $('statPlayers').textContent = state.playerCount ?? '—';
    $('statRound').textContent = state.currentRoundId ? state.currentRoundId.slice(0, 12) + '…' : '—';
    if (state.lastResult) showResult(state.lastResult.number, state.lastResult.color, []);
  });

  socket.on('live_roulette:timer', ({ timeLeft }) => {
    $('timeLeftText').textContent = `${timeLeft}s`;
    const total = phaseDuration[currentPhase] || 15;
    $('timerFill').style.width = ((timeLeft / total) * 100) + '%';
  });

  socket.on('live_roulette:bet_placed', data => {
    log(`← bet_placed: user=${data.userId} ${data.betType}/${data.betValue} ×${data.amount}`, 'in');
  });

  socket.on('live_roulette:result', data => {
    log(`← result: ${data.number} (${data.color}) — ${data.winners?.length ?? 0} winners`, 'in');
    showResult(data.number, data.color, data.winners || []);
  });

  socket.on('live_roulette:error', ({ message }) => {
    log(`← error: ${message}`, 'err');
  });

  socket.on('connect_error', err => {
    log(`Connection error: ${err.message}`, 'err');
  });
}

function showResult(number, color, winners) {
  const colorMap = { red: '#E24B4A', black: 'var(--color-text-primary)', green: '#639922' };
  $('resultNumber').textContent = number;
  $('resultNumber').style.color = colorMap[color] || 'var(--color-text-primary)';
  $('resultColor').textContent = color.toUpperCase();
  const list = $('winnersList');
  list.innerHTML = '';
  winners.forEach(w => {
    const div = document.createElement('div');
    div.className = 'winner-entry';
    div.innerHTML = `<span>User #${w.userId}</span><span>+${Number(w.payout).toFixed(2)}</span>`;
    list.appendChild(div);
  });
}

$('btnConnect').onclick = connect;
$('btnDisconnect').onclick = () => socket?.disconnect();

$('btnJoin').onclick = () => {
  const roomId = $('roomId').value.trim();
  if (!socket?.connected) return log('Not connected', 'err');
  if (!roomId) return log('Enter room ID', 'err');
  log(`→ join: ${roomId}`, 'out');
  socket.emit('live_roulette:join', { roomId });
};

$('btnLeave').onclick = () => {
  const roomId = $('roomId').value.trim();
  if (!socket?.connected) return log('Not connected', 'err');
  log(`→ leave: ${roomId}`, 'out');
  socket.emit('live_roulette:leave', { roomId });
};

$('btnListRooms').onclick = () => {
  if (!socket?.connected) return log('Not connected', 'err');
  log('→ rooms', 'out');
  socket.emit('live_roulette:rooms', null, rooms => {
    if (!rooms) return log('No ack received', 'err');
    log(`← rooms: ${JSON.stringify(rooms.map(r => ({ id: r.roomId, phase: r.phase, players: r.playerCount })))}`, 'in');
  });
};

$('btnBet').onclick = () => {
  const roomId = $('roomId').value.trim();
  const betType = $('betType').value;
  const betValue = $('betValue').value.trim();
  const amount = parseFloat($('betAmount').value);
  if (!socket?.connected) return log('Not connected', 'err');
  if (!roomId || !betValue || isNaN(amount)) return log('Fill all bet fields', 'err');
  const payload = { roomId, betType, betValue, amount };
  log(`→ place_bet: ${betType}/${betValue} ×${amount}`, 'out');
  socket.emit('live_roulette:place_bet', payload);
};

$('btnClearLog').onclick = () => { $('log').innerHTML = ''; };

buildNumberGrid();
log('Ready. Enter server URL and connect.', 'sys');
</script>
